[project]
name = "luxai2021"
version = "0.1.0"
description = "Python game engine and Gymnasium environment for Lux AI Challenge 2021"
readme = "README.md"
requires-python = ">=3.9.25,<3.10"
dependencies = [
    "gymnasium==1.0.0",
    "kagglehub>=0.3.13",
    "numpy==1.24.4",
    "stable-baselines3==2.4.1",
    "tensorboard>=2.14,<2.15",
    "torch==2.7.1",
    "tqdm>=4.66,<5",
]

[build-system]
requires = ["setuptools==65.5.0", "wheel==0.38.4"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.3,<8.4",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["luxai2021/tests"]

[tool.setuptools.packages.find]
include = ["luxai2021*"]

[tool.setuptools.package-data]
luxai2021 = [
    "game/game_constants.json",
    "env/rng/rng.js",
    "env/rng/seedrandom.js",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]

ignore = [
    # Documentation
    "D1",     # Missing docstrings
    "D203",   # One blank line before class
    "D213",   # Multi-line summary second line
    "D400",   # First line should end with period
    "D415",   # First line should end with punctuation

    # Development
    "TD",     # todo tags allowed
    "T201",   # print() allowed for debugging

    # Exception handling
    "TRY003", # Long exception messages allowed
    "EM101",  # Exception string literals allowed
    "COM812", # Trailing comma missing (conflicts with formatter)
]

unfixable = [
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # assert allowed in tests
    "PLR2004", # Magic values allowed in tests
    "ANN",     # Type annotations optional in tests
    "D",       # Docstrings optional in tests
]
